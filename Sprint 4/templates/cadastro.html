<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">         
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- para páginas que vão ser abertas em celular -->
    <title>ELO | Cadastro</title>
    <link href="../static/css/cadastro.css" rel="stylesheet" type="text/css" />
</head>

<body>

    <div class="logo">
        <img src="logo.ELO.png" alt="Logo ELO" width="200">
            <h2><strong>Crie sua conta</strong></h2>
    </div>

    <div class="nome">
        <h4>Nome Completo</h4>
        <input type="text" placeholder="Digite seu nome completo">
    </div>

    <div class="usuario">
        <h4>Novo usuário</h4>
        <input type="text" placeholder="Digite seu usuário">
    </div>

    <div class="Matricula">

        <h4>Matrícula</h4>
        <input type="text" placeholder="Digite sua matrícula">
    </div>

    <div class="CPF">

        <h4>CPF</h4>
        <input type="text" placeholder="Digite seu CPF">
    </div>

    <div class="Curso">

        <h4>Curso</h4>
        <input type="text" placeholder="Digite seu curso">
    </div>

    <div class="Perfil">
        <h4>Perfil</h4>
        <input type="text" placeholder="Aluno, professor ou funcionário">
    </div>

    <div class="Senha">

        <h4>Senha</h4>
        <input type="password" placeholder="Digite sua senha">
    </div>

    <div class="confirmaSenha">

        <h4>Confirmar senha</h4>
        <input type="password" placeholder="Confirme sua senha">
    </div>

    <div class="cadastrar">
        <input type="button" value="CADASTRAR">
    </div>

    <div class="cancelar">
        <input type="button" value="Cancelar">
        <p>
            <small>Já possui uma conta?</small>
            <a href="login.html"><u>Entrar</u></a>
        </p>
    </div>
</body>

</html>
