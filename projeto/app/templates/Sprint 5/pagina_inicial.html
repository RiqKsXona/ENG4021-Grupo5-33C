{% load static %}
<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELO | Página inicial</title>
    <link href="{% static 'Sprint 5/css/pagina_inicial.css' %}" rel="stylesheet" type="text/css">
</head>

<body>
    <header>
        <div class="logo">
            <div class="logo-imagem">
                <img src="{% static 'Sprint 5/logo.ELO-removebg-preview.png' %}" width="200" alt="Logo ELO">
            </div>

        </div>
        <div class="Menu">
            
            <div class="pagina_inicial">
                <h4><a href="{% url 'procurarItem' %}">Procurar item</a></h4>
            </div>

            <div class="reportar_item">
            <h4><a href="{% url 'reportarPerdido' %}">Reportar item perdido</a></h4>
            </div>

            <div class="Perfil">
            <h4><a href="{% url 'perfil' %}">Perfil</a></h4>
            </div>

            
        </div>

    </header>
    <div class="linha">
        <hr>
    </div>

    <div class="titulo">
        <h1>Itens recentes</h1>
    </div>

    <div class="busca">
        <input type="text" placeholder="Buscar por item, local ou descrição...">
    </div>

    <div class="itens">
        {% for item in itens_achados %}
        <div class="item">
            <h2>{{ item.titulo }}</h2>
            <p>{{ item.local }}</p>
        </div>
        {% endfor %}

        {% for item in itens_perdidos %}
        <div class="item">
            <h2>{{ item.titulo }}</h2>
            <p>{{ item.local }}</p>
        </div>
        {% endfor %}
    </div>

    <div class="adicionar">
        <input type="button" value="+">
    </div>

    

</body>

</html>
