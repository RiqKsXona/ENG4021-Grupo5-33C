{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de senha</title>
    <link rel="stylesheet" href="{% static 'Sprint 4/css/css_esquece_a_senha.css' %}">
</head>
<body>
    <main>
        <div class="logo">
            <img src="{% static 'Sprint 4/logo.ELO-removebg-preview.png' %}" alt="ELO - Achados e Perdidos Online - PUC-Rio">
        </div>

        <div class="texto">
            <h1>Recuperação de senha</h1>
            <p>Digite o e-mail cadastrado para receber instruções de recuperação da sua senha.</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="campo">
                <label for="email">E-mail cadastrado</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <button type="submit" class="enviar">Enviar</button>
            <a href="/login/" class="cancelar">Cancelar</a>
        </form>

        <div class="ajuda">
            <p>Precisa de ajuda? Entre em contato com a equipe ELO.</p>
        </div>
    </main>
</body>
</html>
