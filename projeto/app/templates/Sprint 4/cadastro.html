{% load static %}
<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- para páginas que vão ser abertas em celular -->
    <title>ELO | Cadastro</title>
    <link href="{% static 'Sprint 4/css/cadastro.css' %}" rel="stylesheet" type="text/css" />
</head>

<body>

    <div class="logo">
        <img src="{% static 'Sprint 4/logo.ELO-removebg-preview.png' %}" alt="Logo ELO" width="200">
            <h2><strong>Crie sua conta</strong></h2>
    </div>
    <form method="POST">
        {% csrf_token %}

        <div class="nome">
            <h4>Nome Completo</h4>
            <input type="text" name="nomeCompleto" placeholder="Digite seu nome completo" required>
        </div>

        <div class="Matricula">

            <h4>Matrícula</h4>
            <input type="text" name="matriculaUsuario" placeholder="Digite sua matrícula" required>
        </div>

        <div class="email">

            <h4>Email</h4>
            <input type="email" name="emailUsuario" placeholder="Digite seu email" required>
        </div>

        <div class="Curso">

            <h4>Curso</h4>
            <input type="text" name="cursoUsuario" placeholder="Digite seu curso" required>
        </div>

        <div class="Perfil">
            <h4>Perfil</h4>
            <input type="text" name="perfilUsuario" placeholder="Aluno, professor ou funcionário" required>
        </div>

        <div class="Senha">

            <h4>Senha</h4>
            <input type="password" name="senhaUsuario" placeholder="Digite sua senha" required>
        </div>

        <div class="cadastrar">
            <button type="submit">CADASTRAR</button>
        </div>
    </form>
        <div class="cancelar">
            <p>
                <small>Já possui uma conta?</small>
                <a href="{% url 'login' %}"><u>Entrar</u></a>
            </p>
        </div>
    
</body>

</html>
