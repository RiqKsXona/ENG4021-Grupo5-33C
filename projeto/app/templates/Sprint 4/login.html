{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELO | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'Sprint 4/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'Sprint 4/css/login.css' %}">
</head>

<body class="pagina-login">

    <main class="app">

        <div class="logo">
            <img src="{% static 'Sprint 4/logo.ELO-removebg-preview.png' %}" alt="Logo ELO" width="200">
            <h1>Achados e Perdidos Online - PUC-Rio</h1>
        </div>

        <form method="POST" action="{% url 'login' %}">

            {% csrf_token %}

            <div class="campo">
                <h3>Email</h3>
                <input
                    type="email"
                    name="emailLogin"
                    placeholder="Digite seu email"
                    required
                >
            </div>

            <div class="senha">
                <h3>Senha</h3>
                <input
                    type="password"
                    name="senhaLogin"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            {% if erro %}
                <p class="erro">{{ erro }}</p>
            {% endif %}

            <div class="entrar">
                <button type="submit">ENTRAR</button>
            </div>

        </form>

        <div class="criar_cadastro">
            <h4>Não tem login?</h4>

            <a href="{% url 'cadastro' %}">
                <button type="button">CADASTRAR</button>
            </a>
        </div>

    </main>

</body>
</html>
