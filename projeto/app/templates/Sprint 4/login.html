{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELO | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'Sprint 4/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'Sprint 4/css/login.css' %}">
</head>

<body class="pagina-login">
    <main class="app">

        <header class="logo">
            <img src="{% static 'Sprint 4/logo.ELO-removebg-preview.png' %}" alt="Logo ELO">
            <p class="slogan">Achados e Perdidos Online - PUC-Rio</p>
        </header>

        <form method="POST">
            {% csrf_token %}

            <div class="campo-simples">
                <input type="email" id="emailLogin" name="emailLogin" placeholder="E-mail" aria-label="E-mail" autocomplete="email" required>
            </div>

            <div class="campo-simples">
                <input type="password" id="senhaLogin" name="senhaLogin" placeholder="Senha" aria-label="Senha" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primario">ENTRAR</button>

            {% if erro %}
                <p class="erro" role="alert">{{ erro }}</p>
            {% endif %}
        </form>

        <div class="links-login">
            {# Troque o "#" pelo nome da sua rota: {% url 'esqueceu_senha' %} #}
            <a href="{% url 'esqueceu_senha' %}">Esqueci minha senha</a>

            <div class="criar-cadastro">
                <span>Não tem login?</span>
                <a href="{% url 'cadastro' %}" class="btn btn-contorno">Cadastrar</a>
            </div>
        </div>

    </main>
</body>

</html>
