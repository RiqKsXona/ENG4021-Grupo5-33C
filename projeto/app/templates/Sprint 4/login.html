{% load static %}
<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELO | Login</title>
    <link href="{% static 'Sprint 4/css/login.css' %}" rel="stylesheet" type="text/css" />
</head>

<body>

    <div class="logo">
        <img src="{% static 'Sprint 4/logo.ELO-removebg-preview.png' %}" alt="Logo ELO" width="200">
        <h1>Achados e Perdidos Online - PUC-Rio</h1>
    </div>
    <form method="POST">
        
        {% csrf_token %}

        <div class="campo">
            <h3>Email</h3>
            <input type="email" id="emailLogin" name="emailLogin" placeholder="Digite seu email" required>
        </div>

        <div class="senha">
            <h3>Senha</h3>
            <input type="password" id="senhaLogin" name="senhaLogin" placeholder="Digite sua senha" required>
        </div>

        <div class="entrar">
            <button type="submit">ENTRAR</button>
        </div>  

        {% if erro %}
            <p>{{ erro }}</p>
        {% endif %}

    </form>
    <div class="criar_cadastro">

        <h4>nao tem login?</h4>
        <a href="{% url 'cadastro' %}">
            <button type="button">CADASTRAR</button>
        </a>
    </div>
    
</body>

</html>
