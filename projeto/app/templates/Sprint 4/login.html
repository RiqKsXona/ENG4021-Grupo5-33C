{% load static %}
<!DOCTYPE html>

<html>

    <link href="{% static 'Sprint 4/css/login.css' %}" rel="stylesheet" type="text/css" />
</head>

<body>

    <div class="logo">

    </div>

        <a href="{% url 'paginaInicial' %}">

    </div>  

    <div class="criar_cadastro">

        <h4>nao tem login?</h4>

</html>
