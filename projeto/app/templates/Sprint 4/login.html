
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELO | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'Sprint 4/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'Sprint 4/css/login.css' %}">
</head>

<body class="pagina-login">

    <main class="app">

        <header class="topo-login">

            <div></div>

            <div class="logo">
                <img src="{% static 'Sprint 4/logo.ELO-removebg-preview.png' %}"
                    alt="Logo ELO">
            </div>

            <div></div>

        </header>

        <h1 class="titulo-login">Entrar na sua conta</h1>

        {% if erro %}
            <p class="erro" role="alert">{{ erro }}</p>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}


            <div class="campo-card">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="14" rx="2"/>
                    <path d="M3 7l9 6 9-6"/>
                </svg>

                <div class="conteudo">
                    <label for="emailLogin">E-mail</label>

                    <input
                        type="email"
                        id="emailLogin"
                        name="emailLogin"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

            </div>


            <div class="campo-card">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="5" y="11" width="14" height="10" rx="2"/>
                    <path d="M8 11V8a4 4 0 018 0v3"/>
                    <circle cx="12" cy="16" r="1"/>
                </svg>

                <div class="conteudo">
                    <label for="senhaLogin">Senha</label>

                    <input
                        type="password"
                        id="senhaLogin"
                        name="senhaLogin"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="button" class="btn-icone"
                        id="mostrarSenha"
                        aria-label="Mostrar senha">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                </button>

            </div>

            <div class="esqueceu-senha">
                <a href="{% url 'esqueceu_senha' %}">
                    Esqueceu sua senha?
                </a>
            </div>

            <div class="acoes">

                <button type="submit" class="btn btn-primario">
                    Entrar
                </button>

                <div class="texto-cadastro">
                    Não tem uma conta?
                </div>

                <a href="{% url 'cadastro' %}" class="btn btn-contorno">
                    Criar conta
                </a>

            </div>

        </form>

    </main>

    <script>
        // Mostrar ou ocultar senha
        const botaoSenha = document.getElementById("mostrarSenha");
        const campoSenha = document.getElementById("senhaLogin");

        botaoSenha.addEventListener("click", function () {

            const mostrando = campoSenha.type === "text";

            campoSenha.type = mostrando ? "password" : "text";

            botaoSenha.setAttribute(
                "aria-label",
                mostrando ? "Mostrar senha" : "Ocultar senha"
            );

        });
    </script>

</body>
</html>
