{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Item Perdido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'Sprint 4/css/css_reportar_perdido.css' %}" type="text/css">
</head>
<body>
    <main class="pagina">

        <header class="cabecalho">
            <a href="perfil.html" class="topo_voltar" aria-label="Voltar">
                <img src="{% static 'Sprint 4/simbolo_de_menor.png' %}" alt="" width="28" height="28">
            </a>
            <img class="topo_logo" src="{% static 'Sprint 4/logo.ELO-removebg-preview.png' %}" alt="ELO - Achados e Perdidos Online PUC-Rio">
        </header>
    

        <h1 class='titulo'> Reportar Item Perdido </h1>

        <form action="perfil.html" method="post" enctype="multipart/form-data">
            
            <label class="foto_item_perdido" for="foto">
                <img class="icone_camera" src="{% static 'Sprint 4/simbolo_da_camera.png' %}" alt="" width="40" height="40">
                <span>Adicionar foto (opcional)</span>
                <input type="file" id="foto" name="foto" accept="image/*" hidden>
            </label>
 
            <div class="campo nome_objeto">
                <label for="nome_objeto">Nome do objeto</label>
                <input type="text" id="nome_objeto" name="nome_objeto" placeholder="Ex: garrafa térmica amarela" required>
            </div>
            
            <div class="campo categoria">
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" required>
                    <option value="" disabled selected>Selecione uma categoria</option>
                    <option>Documentos</option>
                    <option>Eletrônicos</option>
                    <option>Roupas e acessórios</option>
                    <option>Utensílios</option>
                    <option>Material de estudo</option>
                    <option>Outros</option>
                </select>
            </div>
            <div class="campo onde_perdeu">
                <label for="onde_perdeu">Onde você perdeu?</label>
                <input type="text" id="onde_perdeu" name="onde_perdeu" placeholder="Ex: entre a Pastoral e o RDC" required>
            </div>
            <div class="campo data_perda">
                <label for="data_perda">Quando você perdeu</label>
                <input type="datetime-local" id="data_perda" name="data_perda" required>
            </div>
            <div class="campo descricao">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" name="descricao" placeholder="Detalhes sobre o objeto perdido" required>
            </div>
            <div class="botoes">
                <button type="submit" class="botao_reportar">Publicar item perdido</button>
                <a href="perfil.html" class="botao_voltar">Cancelar</a>
            </div>

        </form>

    </main>


</body>
</html>
