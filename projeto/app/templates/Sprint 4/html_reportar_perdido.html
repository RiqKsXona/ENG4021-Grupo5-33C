{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Item Perdido</title>
    <link rel="stylesheet" href="{% static 'Sprint 4/css/css_reportar_perdido.css' %}" type="text/css">
</head>

<body>
    <div class="logo">
        <img src="{% static 'Sprint 4/logo.ELO-removebg-preview.png' %}" width="50" alt="Logo do Elo">
    </div>

    <div class="titulo">
        <h1>Reportar Item Perdido</h1>
    </div>

    {% if sucesso %}
    <div class="sucesso">
        <h4>Item reportado com sucesso!</h4>
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="foto_item_perdido">
            <img src="{% static 'Sprint 4/simbolo da camera.png' %}" width="200" alt="Foto do item">
        </div>
        <div class="nome_objeto">
            <input type="text" placeholder="Nome do objeto" name="titulo" required>
        </div>
        <div class="categoria">
            <input type="text" placeholder="Categoria" name="categoria" required>
        </div>
        <div class="onde_perdeu">
            <input type="text" placeholder="Onde você perdeu?" name="local" required>
        </div>
        <div class="data_perda">
            <input type="date" name="data">
        </div>
        <div class="descricao">
            <input type="text" placeholder="Descrição" name="descricao">
        </div>
        <div class="botao_reportar">
            <button type="submit">Reportar</button>
        </div>
    </form>

    <div class="botao_voltar">
        <button type="button" onclick="history.back()">Voltar</button>
    </div>
</body>

</html>
