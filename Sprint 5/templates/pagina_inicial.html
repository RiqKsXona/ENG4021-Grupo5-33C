<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELO | Página inicial</title>
    <link href="../static/css/pagina_inicial.css" rel="stylesheet" type="text/css">
</head>

<body>

    <div class="cabecalho">
        <div class="logo">
            <img src="../static/logo.ELO-removebg-preview.png" alt="Logo ELO" width="200">
        </div>
    </div>

    <div class="titulo">
        <h1>Itens recentes</h1>
    </div>

    <div class="busca">
        <input type="text" placeholder="Buscar por item, local ou descrição...">
    </div>

    <div class="itens">

        <div class="item">
            <img src="../static/imagens/garrafa.png" alt="Garrafa térmica" width="200">
            <h2>Garrafa térmica</h2>
            <p>Pastoral</p>
        </div>

        <div class="item">
            <img src="../static/imagens/carregador.png" alt="Carregador de celular" width="200">
            <h2>Carregador de celular</h2>
            <p>LIENG</p>
        </div>

        <div class="item">
            <img src="../static/imagens/guarda_chuva.png" alt="Guarda-chuva" width="200">
            <h2>Guarda-chuva</h2>
            <p>L110</p>
        </div>

        <div class="item">
            <img src="../static/imagens/oculos.png" alt="Óculos de grau" width="200">
            <h2>Óculos de grau</h2>
            <p>RDC</p>
        </div>

        <div class="item">
            <img src="../static/imagens/estojo.png" alt="Estojo" width="200">
            <h2>Estojo</h2>
            <p>Bar das Férias</p>
        </div>

        <div class="item">
            <img src="../static/imagens/casaco.png" alt="Casaco" width="200">
            <h2>Casaco</h2>
            <p>L346</p>
        </div>

    </div>

    <div class="adicionar">
        <input type="button" value="+">
    </div>

    <div class="menu">
        <p class="inicio">Início</p>
        <p>Meus itens</p>
        <p>Conversas</p>
        <p>Perfil</p>
    </div>

</body>

</html>
